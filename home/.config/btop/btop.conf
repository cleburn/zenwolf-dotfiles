# Zenwolf's ordinary system monitor must not wake a suspended discrete GPU.
# Options omitted here retain btop 1.4.7 defaults.
color_theme = "zenwolf-penrose-sky"
shown_boxes = "cpu mem net proc"
proc_sorting = "memory"
show_gpu_info = "Off"
save_config_on_exit = false
shown_gpus = ""

# Show the root volume as the representative storage workload.
# CPU "IO Wait" can also include display page-flip waits.
disks_filter = "/"
show_disks = true
show_io_stat = true
io_mode = false
io_graph_combined = false
swap_disk = false
