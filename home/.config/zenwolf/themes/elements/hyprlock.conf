# Generated by zenwolf-theme-build. Edit profile.json, not this file.
general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

animations {
    enabled = false
}

background {
    monitor =
    path = ~/.local/share/zenwolf/wallpapers/elements.jpg
    color = rgb(f4e8d5)
    blur_passes = 0
    brightness = 1
}

shape {
    monitor =
    size = 460, 300
    color = rgba(f4e8d5e6)
    rounding = 4
    border_size = 1
    border_color = rgba(b8aa94ff)
    position = -480, 0
    halign = center
    valign = center
    zindex = 0
}

label {
    monitor =
    text = $TIME
    color = rgb(2d2925)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = -480, 82
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = Zenwolf · $USER
    color = rgb(6f6457)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = -480, 28
    halign = center
    valign = center
    zindex = 1
}

input-field {
    monitor =
    size = 340, 54
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.20
    dots_center = true
    outer_color = rgb(326d82)
    inner_color = rgba(fbf2e4f5)
    font_color = rgb(2d2925)
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = false
    placeholder_text = <i>Enter password to unlock</i>
    check_color = rgb(246b43)
    fail_color = rgb(a84422)
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    capslock_color = rgb(805813)
    rounding = 2
    position = -480, -60
    halign = center
    valign = center
    zindex = 1
}
