# Generated by zenwolf-theme-build. Edit profile.json, not this file.
general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

animations {
    enabled = false
}

background {
    monitor =
    path = ~/.local/share/zenwolf/wallpapers/aang-meditate.jpg
    color = rgb(170e0a)
    blur_passes = 0
    brightness = 0.7
}

shape {
    monitor =
    size = 460, 300
    color = rgba(170e0ae6)
    rounding = 4
    border_size = 1
    border_color = rgba(6c5945ff)
    position = -480, 0
    halign = center
    valign = center
    zindex = 0
}

label {
    monitor =
    text = $TIME
    color = rgb(f3dfc1)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = -480, 82
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = Zenwolf · $USER
    color = rgb(a49379)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = -480, 28
    halign = center
    valign = center
    zindex = 1
}

input-field {
    monitor =
    size = 340, 54
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.20
    dots_center = true
    outer_color = rgb(79a28e)
    inner_color = rgba(21150ff5)
    font_color = rgb(f3dfc1)
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = false
    placeholder_text = <i>Enter password to unlock</i>
    check_color = rgb(637f6f)
    fail_color = rgb(a9323f)
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    capslock_color = rgb(bd7d25)
    rounding = 2
    position = -480, -60
    halign = center
    valign = center
    zindex = 1
}
