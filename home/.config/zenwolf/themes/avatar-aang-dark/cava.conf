[general]
live-config = 1
framerate = 60
autosens = 1
sensitivity = 100
bars = 0
bar_width = 2
bar_spacing = 1
center_align = 1
max_height = 90
lower_cutoff_freq = 50
higher_cutoff_freq = 10000
sleep_timer = 10

[input]
method = pipewire
source = auto
active = 1
virtual = 1

[output]
method = noncurses
orientation = bottom
channels = stereo
synchronized_sync = 0
show_idle_bar_heads = 1

[color]
background = '#0b0712'
gradient = 1
gradient_color_1 = '#668fb5'
gradient_color_2 = '#9a7bd2'
gradient_color_3 = '#c49cff'
gradient_color_4 = '#d183c7'

[smoothing]
noise_reduction = 77
