# Generated by zenwolf-theme-build. Edit profile.json, not this file.
general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

animations {
    enabled = false
}

background {
    monitor =
    path = ~/.local/share/zenwolf/wallpapers/avatar-state.png
    color = rgb(101820)
    blur_passes = 0
    brightness = 0.72
}

shape {
    monitor =
    size = 460, 300
    color = rgba(101820e6)
    rounding = 4
    border_size = 1
    border_color = rgba(426b75ff)
    position = -480, 0
    halign = center
    valign = center
    zindex = 0
}

label {
    monitor =
    text = $TIME
    color = rgb(e8f3f5)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = -480, 82
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = Zenwolf · $USER
    color = rgb(8fa6ad)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = -480, 28
    halign = center
    valign = center
    zindex = 1
}

input-field {
    monitor =
    size = 340, 54
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.20
    dots_center = true
    outer_color = rgb(4fd5df)
    inner_color = rgba(14262ef5)
    font_color = rgb(e8f3f5)
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = false
    placeholder_text = <i>Enter password to unlock</i>
    check_color = rgb(5e9b72)
