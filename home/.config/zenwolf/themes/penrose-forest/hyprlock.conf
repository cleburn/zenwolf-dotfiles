# Generated by zenwolf-theme-build. Edit profile.json, not this file.
general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

animations {
    enabled = false
}

background {
    monitor =
    path = ~/.local/share/zenwolf/wallpapers/penrose-triangle-forest.png
    color = rgb(0c0c10)
    blur_passes = 0
    brightness = 0.72
}

shape {
    monitor =
    size = 460, 300
    color = rgba(0c0c10eb)
    rounding = 14
    border_size = 1
    border_color = rgba(a1a99eff)
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}

label {
    monitor =
    text = $TIME
    color = rgb(cdd0cb)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 82
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = Zenwolf · $USER
    color = rgb(5e706c)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 28
    halign = center
    valign = center
    zindex = 1
}

input-field {
    monitor =
    size = 340, 54
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.20
    dots_center = true
    outer_color = rgb(a1a99e)
    inner_color = rgba(1b1d1deb)
    font_color = rgb(cdd0cb)
    font_family = JetBrainsMono Nerd Font
