# Zenwolf Matrix-rain preset. This file is sourced by ~/.local/bin/matrix.
# UniMatrix speed runs from very slow (0) to fastest (100).
speed=75

# Use the semantic ANSI cyan slot so Ghostty remaps the rain with each theme.
color=cyan

# c/C: lowercase/uppercase Russian Cyrillic; n: numbers; u: custom symbols.
character_sets=cCnu
custom_characters='∑∫√∞≈≠≤≥∆λπφΩαβγдЖЯ'

asynchronous=true
bold=false
show_status=false
