general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

animations {
    enabled = false
}

background {
    monitor =
    color = rgb(0b1017)
}

label {
    monitor =
    text = $TIME
    color = rgb(e6edf3)
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = Zenwolf · $USER
    color = rgb(94a3b8)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 42
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 54
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.20
    dots_center = true
    outer_color = rgb(39c5cf)
    inner_color = rgb(111827)
    font_color = rgb(e6edf3)
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = false
    placeholder_text = <i>Enter password to unlock</i>
    check_color = rgb(22c55e)
    fail_color = rgb(ef4444)
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    capslock_color = rgb(f59e0b)
    rounding = 14
    position = 0, -48
    halign = center
    valign = center
}
